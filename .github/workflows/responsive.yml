name: Responsive check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    name: Layout + visual matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Lint responsive architecture
        run: npm run lint:responsive

      - name: Responsive matrix (layout + visual + devices)
        run: npm run check:responsive
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure screenshots / diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-test-results
          path: |
            test-results/
            tests/responsive/baselines/
          retention-days: 14
